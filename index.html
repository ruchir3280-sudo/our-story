<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Story ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
    background:black;
}

/* ALL PAGES */

.page{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    transition:all 1s ease;
}

/* HEART BACKGROUND */

.hearts-bg{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
    radial-gradient(circle at center,#ff4d88 0%,#ff0066 30%,#990033 100%);
}

.bg-heart{
    position:absolute;
    color:rgba(255,255,255,0.15);
    animation:float 10s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-150px);
    }
}

.content{
    position:relative;
    z-index:5;
    width:90%;
    max-width:500px;
    padding:20px;
    animation:fadeIn 1.5s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.quote{
    color:white;
    font-size:30px;
    font-weight:bold;
    line-height:1.8;

    text-shadow:
    0 0 10px white,
    0 0 20px #ff99cc,
    0 0 40px #ff4d88;
}

.tap{
    margin-top:30px;
    color:white;
    font-size:18px;
    animation:blink 1.5s infinite;
}

@keyframes blink{
    50%{
        opacity:.3;
    }
}

.hide{
    opacity:0;
    transform:scale(1.15);
}

/* PAGE 2 */

#page2{
    display:none;
}

/* PAGE 3 */

#page3{
    display:none;

    background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.65)),
    url('poster.jpg');

    background-size:cover;
    background-position:center;
}

.story-card{
    width:90%;
    max-width:420px;
    padding:20px;

    background:rgba(255,255,255,.15);
    backdrop-filter:blur(10px);

    border-radius:25px;
    color:white;
}

.story-card h1{
    font-size:38px;
    margin-bottom:20px;
    text-shadow:0 0 10px pink;
}

.story-card img{
    width:100%;
    border-radius:20px;
    margin-bottom:20px;
}

.story-quote{
    font-size:22px;
    font-weight:800;
    line-height:1.8;
    margin-bottom:25px;

    text-shadow:
    0 0 8px #ff66b2,
    0 0 15px #ff3399,
    0 0 30px #ff1a75;
}

.audio-box{
    background:white;
    padding:12px;
    border-radius:15px;
}

audio{
    width:100%;
}

</style>
</head>
<body>

<!-- PAGE 1 -->

<div id="page1" class="page" onclick="goToPage2()">

    <div class="hearts-bg" id="bg1"></div>

    <div class="content">

        <div class="quote">
            ನಿನ್ನ ನಗುವು ನೋಡಿದ ದಿನದಿಂದ...<br>
            ನನ್ನ ಹೃದಯ ನಿನ್ನದಾಯಿತು... ❤️
        </div>

        <div class="tap">
            ✨ Tap To Continue ✨
        </div>

    </div>

</div>

<!-- PAGE 2 -->

<div id="page2" class="page" onclick="goToStory()">

    <div class="hearts-bg" id="bg2"></div>

    <div class="content">

        <div class="quote">
            ನೀ ಬಂದ ಮೇಲೆ...<br>
            ನನ್ನ ಬದುಕಿನ ಪ್ರತಿಯೊಂದು ಕ್ಷಣವೂ<br>
            ಹಬ್ಬದಂತಾಗಿದೆ... ❤️
        </div>

        <div class="tap">
            🌹 One More Tap 🌹
        </div>

    </div>

</div>

<!-- PAGE 3 -->

<div id="page3" class="page">

    <div class="story-card">

        <h1>Our Story ❤️</h1>

        <img src="poster.jpg" alt="Story">

        <div class="story-quote">
            ನಾನಿರುವುದು ನಿನಗೆ...<br>
            ನೀನಿರುವುದು ನನಗೆ...<br>
            ನಮ್ಮಿಬ್ಬರ ಪ್ರೀತಿ ಬೆಳೆಯಲಿ<br>
            ಆಕಾಶದ ಕೊನೆಗೆ... ❤️
        </div>

        <div class="audio-box">
            <audio controls autoplay>
                <source src="song.mp3" type="audio/mpeg">
            </audio>
        </div>

    </div>

</div>

<script>

/* PAGE TRANSITIONS */

function goToPage2(){

    const p1=document.getElementById("page1");

    p1.classList.add("hide");

    setTimeout(()=>{
        p1.style.display="none";
        document.getElementById("page2").style.display="flex";
    },1000);

}

function goToStory(){

    const p2=document.getElementById("page2");

    p2.classList.add("hide");

    setTimeout(()=>{
        p2.style.display="none";
        document.getElementById("page3").style.display="flex";
    },1000);

}

/* HEART BACKGROUND FOR PAGE 1 & PAGE 2 ONLY */

function createBackgroundHeart(containerId){

    const heart=document.createElement("div");

    heart.className="bg-heart";
    heart.innerHTML="❤";

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(20+Math.random()*50)+"px";
    heart.style.animationDuration=(6+Math.random()*6)+"s";

    document.getElementById(containerId).appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },12000);

}

setInterval(()=>{
    if(document.getElementById("page1").style.display!=="none"){
        createBackgroundHeart("bg1");
    }
},300);

setInterval(()=>{
    if(document.getElementById("page2").style.display==="flex"){
        createBackgroundHeart("bg2");
    }
},300);

</script>

</body>
            </html>
